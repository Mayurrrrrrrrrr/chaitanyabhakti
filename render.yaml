services:
  - type: web
    name: vaishnav-bhakti-backend
    env: node
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DB_HOST
        fromDatabase:
          name: vaishnav-bhakti-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: vaishnav-bhakti-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: vaishnav-bhakti-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: vaishnav-bhakti-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: vaishnav-bhakti-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        value: https://chaitanyabhakti.vercel.app

databases:
  - name: vaishnav-bhakti-db
    databaseName: vaishnav_bhakti
    user: vaishnav_user
    plan: free